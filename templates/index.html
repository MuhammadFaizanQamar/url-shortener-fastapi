<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>URL Shortener</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h1 class="text-center mb-4">URL Shortener</h1>

    <!-- Shorten Form -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="input-group">
                <input type="text" id="urlInput" class="form-control"
                       placeholder="Paste your long URL here...">
                <button class="btn btn-primary" onclick="shortenUrl()">
                    Shorten
                </button>
            </div>
            <div id="result" class="mt-3"></div>
        </div>
    </div>

    <!-- Stats Table -->
    <div class="card">
        <div class="card-body">
            <h5 class="card-title">All Shortened URLs</h5>
            <table class="table table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>Original URL</th>
                        <th>Short Code</th>
                        <th>Clicks</th>
                        <th>Created</th>
                    </tr>
                </thead>
                <tbody id="statsTable">
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    async function shortenUrl() {
        const url = document.getElementById('urlInput').value;

        const response = await fetch('/shorten', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({original_url: url})
        });

        const data = await response.json();
        const shortUrl = `http://127.0.0.1:8000/${data.short_code}`;

        document.getElementById('result').innerHTML = `
            <div class="alert alert-success">
                Short URL: <a href="${shortUrl}" target="_blank">${shortUrl}</a>
            </div>
        `;

        loadStats();
    }

    async function loadStats() {
        const response = await fetch('/stats/all');
        const urls = await response.json();

        const tbody = document.getElementById('statsTable');
        tbody.innerHTML = urls.map(url => `
            <tr>
                <td>${url.original_url}</td>
                <td><a href="/${url.short_code}" target="_blank">${url.short_code}</a></td>
                <td>${url.clicks}</td>
                <td>${url.created_at}</td>
            </tr>
        `).join('');
    }

    loadStats();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
